<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Matemática 1 en Juego</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800;900&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: banda violeta tipo tapa del libro con puntaje → pestañas de capítulos → tarjetas de tema con ejercicios → panel de premios */
:root{
  --bg:#F6F4FC; --surface:#FFFFFF; --surface2:#EFEBFA; --ink:#211A4A; --muted:#5E5785; --line:#DCD5F2;
  --vio:#3B2A8C; --vio-ink:#FFFFFF; --mag:#D9157A; --mag-soft:#FDE6F1; --teal:#18917D; --teal-soft:#DFF4EF;
  --yel:#F5B400; --yel-soft:#FFF3D3; --bad:#C62D3A; --bad-soft:#FCE4E6;
  --display:"Rubik","Arial Rounded MT Bold",system-ui,sans-serif; --body:"Work Sans",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130F2B; --surface:#1D1742; --surface2:#262055; --ink:#EEEBFF; --muted:#B0A8DA; --line:#362E6E;
  --vio:#4A39A8; --vio-ink:#FFFFFF; --mag:#FF4FA3; --mag-soft:#3A1838; --teal:#4FD3BC; --teal-soft:#123A3A;
  --yel:#FFC93C; --yel-soft:#3A3115; --bad:#FF6B76; --bad-soft:#3E1A22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130F2B; --surface:#1D1742; --surface2:#262055; --ink:#EEEBFF; --muted:#B0A8DA; --line:#362E6E;
  --vio:#4A39A8; --vio-ink:#FFFFFF; --mag:#FF4FA3; --mag-soft:#3A1838; --teal:#4FD3BC; --teal-soft:#123A3A;
  --yel:#FFC93C; --yel-soft:#3A3115; --bad:#FF6B76; --bad-soft:#3E1A22; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}

/* Banda superior */
.top{background:#3B2A8C;color:#fff;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:auto 0 0 0;height:70%;background-image:linear-gradient(rgba(79,211,188,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(79,211,188,.28) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(transparent,#000)}
.top .wrap{position:relative;padding-block:22px 20px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
.kick{display:inline-block;background:#F5B400;color:#241A63;font-family:var(--display);font-weight:800;font-size:.78rem;letter-spacing:.08em;padding:3px 9px;text-transform:uppercase}
.top h1{font-size:clamp(1.9rem,5vw,2.9rem);font-weight:900;line-height:1;margin-top:10px;letter-spacing:-.01em}
.top h1 span{color:#FF5BAA}
.who{margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.92rem;color:#E4DEFF}
.who input{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;width:210px;max-width:100%}
.who input::placeholder{color:#C9C0F5}
.reg{font-size:.8rem;margin-top:8px;font-weight:600}
.reg.on{color:#9FF0DD}
.reg.off{color:#FFC6E0}
.ptab{overflow-x:auto}
.ptab table{width:100%;border-collapse:collapse;font-size:.86rem;font-variant-numeric:tabular-nums}
.ptab th{background:var(--surface2);color:var(--ink);text-align:left;padding:7px 10px;font-family:var(--display);font-size:.78rem;letter-spacing:.04em;white-space:nowrap}
.ptab td{border-top:1px solid var(--line);padding:7px 10px;white-space:nowrap}
.ptab td.l{white-space:normal;min-width:180px}
.stt{font-weight:700;font-size:.78rem;border-radius:999px;padding:2px 8px}
.stt.y{background:var(--teal-soft);color:var(--teal)}
.stt.n{background:var(--bad-soft);color:var(--bad)}
.who input#numero{width:58px;text-align:center;font-weight:700}
.score{background:#fff;color:#241A63;border-radius:14px;padding:12px 16px;min-width:250px;box-shadow:0 6px 0 #F5B400}
.score .pts{font-family:var(--display);font-weight:900;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums;color:#D9157A}
.score .pts small{font-size:.9rem;color:#241A63;font-weight:700;margin-left:4px}
.score .lvl{font-size:.82rem;font-weight:600;margin-top:4px}
.bar{height:10px;background:#E9E4FA;border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#18917D,#4FD3BC);width:0;transition:width .5s}
.score .next{font-size:.78rem;color:#5E5785;margin-top:5px}

/* Pestañas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:.88rem}
.tab b{font-family:var(--display);background:var(--surface2);color:var(--mag);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem}
.tab .pc{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{background:var(--vio);border-color:var(--vio);color:#fff}
.tab[aria-selected="true"] b{background:var(--mag);color:#fff}
.tab[aria-selected="true"] .pc{color:#D8D0FF}
.tab.premios b{color:#8a6300;background:var(--yel-soft)}

main .wrap{padding-block:22px 48px}
.chead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chead small{display:block;font-family:var(--display);font-weight:800;color:var(--mag);letter-spacing:.1em;font-size:.8rem}
.chead h2{font-size:clamp(1.5rem,3.5vw,2rem);font-weight:900;color:var(--ink);text-transform:uppercase}
.medal{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.medal .m{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;border:2px dashed var(--line);color:var(--muted)}
.medal.on .m{border:none;background:var(--yel);color:#3a2a00}

.temas{display:grid;gap:16px}
.tema{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.th{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(90deg,var(--vio),#4b4fb0);color:#fff}
.th .n{font-family:var(--display);font-weight:900;font-size:1.6rem;line-height:1;min-width:1.6em}
.th h3{font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.02em;background:var(--mag);padding:2px 8px}
.th .tp{margin-left:auto;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.15);padding:2px 8px;border-radius:999px;white-space:nowrap}
.ejs{display:grid;gap:0}
.fb .help{margin-top:6px}
.sol{background:var(--surface2);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:6px;font-size:.94rem}
.sol .tag{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--vio);justify-self:start;padding:1px 8px;border-radius:4px}
.sol ol{margin:0;padding-left:22px;display:grid;gap:5px}
.sol li::marker{color:var(--mag);font-weight:800}
.tipx{background:var(--yel-soft);border-left:4px solid var(--yel);padding:6px 10px;border-radius:0 6px 6px 0}
.rec{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0;border-bottom:1.5px solid var(--line)}
.rec>div{padding:12px 14px;display:grid;gap:6px;align-content:start;min-width:0}
.rec-r{background:var(--yel-soft)}
.rec-x{background:var(--teal-soft)}
.rec p{margin:0;font-size:.94rem;max-width:65ch}
.rec .tag{font-family:var(--display);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;justify-self:start;padding:1px 8px;border-radius:4px;color:#fff}
.rec-r .tag{background:#B07F00}
.rec-x .tag{background:#18917D}
.rec .xl{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;overflow-x:auto}
@media (max-width:640px){.rec{grid-template-columns:1fr}}
.ej{padding:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.ej:first-child{border-top:none}
.q{display:flex;gap:10px;align-items:baseline}
.q .l{font-family:var(--display);font-weight:800;color:var(--mag)}
.q .tx{min-width:0}
.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ans input{width:150px;max-width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 10px;font-weight:600;font-variant-numeric:tabular-nums}
.ans input:focus{border-color:var(--vio)}
.btn{border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-family:var(--display)}
.btn.go{background:var(--teal);color:#fff}
:root:not([data-theme="light"]) .btn.go{color:#0b2a26}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.go{color:#fff}}
:root[data-theme="light"] .btn.go{color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1.5px solid var(--line);font-family:var(--body);font-weight:600;font-size:.85rem;padding:6px 10px}
.opt{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font-weight:600}
.opt:hover{border-color:var(--vio)}
.fb{font-size:.92rem;border-radius:8px;padding:8px 12px;display:none}
.fb.ok{display:block;background:var(--teal-soft);color:var(--ink);border-left:4px solid var(--teal)}
.fb.no{display:block;background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.hint{display:block;background:var(--yel-soft);color:var(--ink);border-left:4px solid var(--yel)}
.fb b{color:var(--ink)}
.ej.solved input{border-color:var(--teal);background:var(--teal-soft)}
.ej.solved .opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.badge{font-family:var(--display);font-weight:800;font-size:.8rem;color:var(--teal);white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;font-size:.9em;margin:0 .12em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .15em}
.rad .ov{border-top:1.5px solid currentColor;padding:0 .1em}
.mth{font-weight:600;color:var(--vio)}
:root:not([data-theme="light"]) .mth{color:inherit}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .mth{color:var(--vio)}}
:root[data-theme="light"] .mth{color:var(--vio)}

/* Premios */
.prizes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.prize{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start;position:relative}
.prize .tier{display:flex;align-items:center;gap:10px}
.prize .coin{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.1rem;color:#2a1d00}
.prize h3{font-size:1.15rem;font-weight:900}
.prize .need{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prize .state{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.prize.won{border-color:var(--teal);box-shadow:0 4px 0 var(--teal)}
.prize.won .state{color:var(--teal)}
.prize .state{color:var(--muted)}
.tbd{background:var(--surface2);border:1.5px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem}
.tbd strong{display:block;font-family:var(--display);font-size:.75rem;letter-spacing:.08em;color:var(--mag);text-transform:uppercase}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas span{font-size:.8rem;background:var(--yel-soft);border-radius:999px;padding:3px 9px}
.rules{margin-top:22px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:8px;max-width:70ch}
.rules h3{font-size:1.05rem}
.rules ul{margin:0;padding-left:20px}
.rules li::marker{color:var(--mag)}
.reset{margin-top:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
.btn.danger{background:var(--bad);color:#fff}
/* Foto de la hoja */
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo label.pick{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--mag);color:var(--mag);background:var(--mag-soft);border-radius:8px;padding:7px 12px;font-weight:700;font-family:var(--display);cursor:pointer;font-size:.92rem}
.photo label.pick:focus-within{outline:3px solid var(--yel);outline-offset:2px}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.photo img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
.photo .pn{font-size:.82rem;color:var(--muted)}
.req{font-size:.82rem;color:var(--muted)}
.req b{color:var(--mag)}
.btn.go[disabled]{opacity:.45;cursor:not-allowed}
.review{display:none;font-size:.92rem;border-radius:8px;padding:10px 12px;background:var(--surface2);border:1.5px solid var(--line)}
.review.show{display:grid;gap:6px}
.review h4{margin:0;font-family:var(--display);font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:var(--vio)}
.review ul{margin:0;padding-left:18px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk span{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 9px}
.chk .y{background:var(--teal-soft);color:var(--teal)}
.chk .n{background:var(--bad-soft);color:var(--bad)}
.howto{background:var(--yel-soft);border-left:5px solid var(--yel);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:16px;font-size:.92rem;display:flex;gap:14px;flex-wrap:wrap}
.howto span b{font-family:var(--display);color:var(--mag);margin-right:4px}
.unavail{background:var(--bad-soft);border-left:5px solid var(--bad);border-radius:0 10px 10px 0;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--vio);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* Bienvenida */
.player{font-size:.95rem;color:#E4DEFF}
.player b{color:#fff;font-family:var(--display)}
.welcome{position:fixed;inset:0;z-index:40;display:grid;place-items:center;overflow-y:auto;background:rgba(14,10,38,.78);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wcard{background:var(--surface);color:var(--ink);border-radius:18px;width:min(440px,100%);padding:16px 18px 20px;display:grid;gap:10px;text-align:center;box-shadow:0 8px 0 var(--yel);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.wcard h2{font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--mag);line-height:1.1}
.wcard p{margin:0;color:var(--muted);font-size:.95rem}
.wsvg svg{width:100%;height:auto;display:block;border-radius:12px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;text-align:left}
.wf{display:grid;gap:4px;min-width:0}
.wf label{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.wf input{width:100%;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:1.05rem;font-weight:600}
.wf input:focus{border-color:var(--mag)}
.wn input{text-align:center;font-family:var(--display);font-weight:900;font-size:1.3rem}
.werr{color:var(--bad);font-weight:700;font-size:.9rem;min-height:1.2em}
.wgo{font-size:1.15rem;padding:12px;border-radius:10px}
@media (max-width:420px){.wrow{grid-template-columns:1fr}}
/* Sonido y festejos */
.sndbtn{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:.88rem}
.scene{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(14,10,38,.6);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow:hidden;cursor:pointer}
.scard{background:var(--surface);color:var(--ink);border-radius:18px;padding:14px 14px 18px;width:min(440px,100%);text-align:center;display:grid;gap:4px;animation:pop .35s cubic-bezier(.2,1.6,.4,1);position:relative;z-index:2}
.scard svg{width:100%;height:auto;border-radius:12px;display:block}
.stitle{font-family:var(--display);font-weight:900;font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;letter-spacing:-.01em}
.scene.ok .stitle{color:var(--mag)}
.scene.no .stitle{color:var(--bad);font-size:clamp(1.5rem,6vw,2rem)}
.ssub{font-weight:600;color:var(--muted)}
.jump{animation:jump .42s ease-in-out infinite alternate}
.jump.d2{animation-delay:.21s}
.sob{animation:sob 1.1s ease-in-out infinite}
.ballin{animation:ballin .6s ease-out both}
.netw{animation:netw .6s ease-out .3s both;transform-box:fill-box;transform-origin:center}
.conf{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;z-index:1;animation:fall linear forwards}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@keyframes jump{to{transform:translateY(-16px)}}
@keyframes sob{50%{transform:translateY(3px)}}
@keyframes ballin{from{transform:translate(-120px,-30px)}}
@keyframes netw{40%{transform:scaleX(1.06)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.jump,.sob,.ballin,.netw,.scard{animation:none}.conf{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-family:var(--display);transition:transform .35s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (max-width:640px){.top .wrap{grid-template-columns:1fr}.score{min-width:0}.th h3{font-size:.82rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div>
    <span class="kick">Matemática 1 · Nuevo Dinámica</span>
    <h1>Matemática 1 <span>en Juego</span></h1>
    <div class="who"><span class="player" id="player"></span><button class="sndbtn" id="cambiar" type="button">Cambiar jugador</button><button class="sndbtn" id="snd" type="button">🔊 Sonido: sí</button></div>
    <div class="reg" id="reg" hidden></div>
  </div>
  <div class="score" aria-live="polite">
    <div class="pts"><span id="pts">0</span><small>puntos</small></div>
    <div class="lvl" id="lvl">Nivel: Inicial</div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="next" id="next"></div>
  </div>
</div></header>

<nav class="tabs" aria-label="Capítulos"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status"></div>
<div class="scene" id="scene" hidden role="dialog" aria-live="assertive"></div>
<div class="welcome" id="welcome" hidden></div>

<script>
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R=(x,i='')=>`<span class="rad">${i?`<sup>${i}</sup>`:''}√<span class="ov">${x}</span></span>`;
const M=s=>`<span class="mth">${s}</span>`;

const REC={
1:{r:"Cada cifra vale según el lugar que ocupa: unidades, decenas (10), centenas (100), unidades de mil (1 000)… Las potencias de 10 marcan el lugar: 10³ = 1 000, 10² = 100, 10¹ = 10, 10⁰ = 1.",x:["En 63 528, el 3 está en las unidades de mil → vale 3 000.","4 . 10³ + 6 . 10¹ + 9 . 10⁰ = 4 000 + 60 + 9 = 4 069"]},
2:{r:"En una división se cumple D = d . c + r, y el resto siempre es menor que el divisor. Distributiva: el número de afuera multiplica a cada término del paréntesis.",x:["38 : 7 → 7 . 5 = 35 y sobran 3 → cociente 5, resto 3","(4 + 6 − 1) . 2 = 8 + 12 − 2 = 18"]},
3:{r:"Potencia: la base se multiplica por sí misma tantas veces como dice el exponente. Raíz: buscás el número que, elevado al índice, da el de adentro. Si multiplicás potencias de igual base, los exponentes se suman.",x:["3⁴ = 3 . 3 . 3 . 3 = 81",`${R("64","3")} = 4 porque 4 . 4 . 4 = 64`,"5<sup>x</sup> . 5² = 5⁷ → x + 2 = 7 → x = 5"]},
4:{r:"1) Separá en términos con los + y − que están fuera de los paréntesis. 2) Resolvé paréntesis, potencias y raíces. 3) Multiplicaciones y divisiones. 4) Al final, sumas y restas.",x:[`20 − 3 . 4 + ${R("9")} = 20 − 12 + 3 = 11`,"(2 + 4)² : 4 = 6² : 4 = 36 : 4 = 9"]},
5:{r:"Por 2: termina en número par. Por 3: la suma de sus cifras es múltiplo de 3. Por 5: termina en 0 o 5. Por 9: la suma de sus cifras es múltiplo de 9. Un número primo solo se divide por 1 y por sí mismo.",x:["234 → 2 + 3 + 4 = 9 → es divisible por 3 y por 9","29 es primo: no lo divide ni 2, ni 3, ni 5"]},

7:{r:"Factorizá los dos números. mcm: comunes y no comunes con el mayor exponente (sirve cuando algo vuelve a coincidir). dcm: solo los comunes con el menor exponente (sirve para repartir en partes iguales).",x:["8 = 2³ y 10 = 2 . 5","mcm (8; 10) = 2³ . 5 = 40","dcm (8; 10) = 2"]},

15:{r:"Sumas y restas: encolumná alineando la coma. Multiplicación: multiplicá sin coma y poné tantos decimales como tengan los dos factores juntos. División por un decimal: multiplicá los dos números por 10 o por 100 hasta que el divisor no tenga coma.",x:["1,5 + 0,4 . 2 = 1,5 + 0,8 = 2,3","3,6 : 0,4 = 36 : 4 = 9"]},
16:{r:"Porcentaje: el x % de un número es x : 100 . número. Redondeo: mirá la cifra siguiente; si es 5 o más, subí uno; si es menos de 5, queda igual.",x:["15 % de 200 = 15 : 100 . 200 = 30","2,734 redondeado a los centésimos → 2,73 (porque 4 es menor que 5)"]},
17:{r:"Un punto se escribe (x; y): primero cuánto avanzás en horizontal y después cuánto subís en vertical.",x:["C (3; 5): avanzo 3 a la derecha y subo 5","D (0; 2): no avanzo y subo 2 (está sobre el eje y)"]},
18:{r:"Con la fórmula, reemplazá x por el número que te dan y hacé la cuenta para encontrar y.",x:["y = 3 . x + 1, con x = 4 → y = 3 . 4 + 1 = 13"]},
19:{r:"Proporcionalidad directa: si una cantidad se duplica, la otra también. La constante es k = y : x (el precio de 1). Para calcular: y = k . x.",x:["4 cuadernos cuestan $2 000 → k = 2 000 : 4 = 500 por cuaderno","7 cuadernos → 500 . 7 = $3 500"]},
20:{r:"Proporcionalidad inversa: si una cantidad se duplica, la otra se reduce a la mitad. Lo que se mantiene igual es el producto: x . y = k.",x:["2 canillas llenan un tanque en 6 h → k = 2 . 6 = 12","3 canillas → 12 : 3 = 4 h"]},
21:{r:"Poliedros: todas sus caras son planas. Cuerpos redondos: tienen alguna parte curva. Fórmula de Euler: Caras + Vértices = Aristas + 2.",x:["Pirámide de base cuadrada: 5 caras + 5 vértices = A + 2 → A = 8 aristas"]},
22:{r:"Hay 5 poliedros regulares y el nombre dice cuántas caras tienen: tetra = 4, hexa = 6 (el cubo), octa = 8, dodeca = 12, icosa = 20.",x:["Dodecaedro → dodeca = 12 → 12 caras (pentágonos)"]},
23:{r:"El desarrollo plano es el cuerpo “desarmado”. Prisma: 2 bases + rectángulos. Pirámide: 1 base + triángulos. Cilindro: 2 círculos + 1 rectángulo. Cono: 1 círculo + 1 sector circular.",x:["Prisma de base triangular → 2 triángulos + 3 rectángulos"]},
24:{r:"Paralelas: nunca se cortan. Secantes: se cortan en un punto. Perpendiculares: se cortan formando ángulos rectos (90°).",x:["Las vías del tren son paralelas; los bordes de una hoja en la esquina son perpendiculares"]},
25:{r:"1° = 60' y 1' = 60''. Para pasar grados a minutos, multiplicá por 60. Si al sumar los minutos llegan a 60 o más, cambiá 60' por 1°.",x:["5° = 5 . 60 = 300'","12° 50' + 3° 20' = 15° 70' = 16° 10'"]},
26:{r:"Complementarios: suman 90°. Suplementarios: suman 180°. Agudo: menos de 90°. Recto: 90°. Obtuso: entre 90° y 180°. Llano: 180°.",x:["Complemento de 25° = 90° − 25° = 65°","Suplemento de 25° = 180° − 25° = 155°"]},
27:{r:"La mediatriz es la recta perpendicular que pasa por el punto medio del segmento: lo corta en dos partes iguales.",x:["Si AB = 10 cm, el punto medio está a 10 : 2 = 5 cm de A"]},
28:{r:"La bisectriz sale del vértice y divide al ángulo en dos ángulos iguales.",x:["Bisectriz de 60° → dos ángulos de 60° : 2 = 30°"]},
29:{r:"Los 3 ángulos de un triángulo suman 180°. Para que el triángulo exista, cada lado tiene que ser menor que la suma de los otros dos.",x:["Ángulos de 40° y 75° → 180° − 40° − 75° = 65°","¿Lados 2, 3 y 4? 2 + 3 = 5, que es mayor que 4 → sí existe"]},
30:{r:"Si conocés dos lados, el tercero tiene que ser menor que la suma de los dos y mayor que su diferencia.",x:["Lados de 6 cm y 2 cm → el tercero tiene que estar entre 4 cm y 8 cm, sin llegar a esos valores"]},
31:{r:"Los 4 ángulos de un cuadrilátero suman 360°. Paralelogramo: 2 pares de lados paralelos. Trapecio: 1 solo par. Trapezoide: ninguno.",x:["Ángulos de 100°, 70° y 95° → 360° − 265° = 95°"]},
32:{r:"Usá las propiedades: el rectángulo y el cuadrado tienen ángulos rectos. Las diagonales del rombo y del cuadrado son perpendiculares (forman 90°) y se cortan en su punto medio.",x:["Cuadrado de 4 cm: trazá un lado de 4 cm, perpendiculares con la escuadra en cada punta, marcá 4 cm y uní"]},
33:{r:"El diámetro es el doble del radio: d = 2 . r. Secante: corta a la circunferencia en 2 puntos. Tangente: la toca en 1 punto. Exterior: no la toca.",x:["Radio de 7 cm → diámetro 2 . 7 = 14 cm","Diámetro de 20 cm → radio 20 : 2 = 10 cm"]},
34:{r:"Mediatrices → circuncentro: el centro de la circunferencia que pasa por los 3 vértices. Bisectrices → incentro: el centro de la circunferencia que toca los 3 lados por dentro.",x:["Tres pueblos y una antena a la misma distancia de los tres → se usan las mediatrices"]},
35:{r:"En un polígono de n lados: diagonales = n . (n − 3) : 2. Suma de los ángulos interiores = 180° . (n − 2).",x:["Cuadrado (n = 4): diagonales 4 . 1 : 2 = 2 · ángulos 180° . 2 = 360°","Octógono (n = 8): diagonales 8 . 5 : 2 = 20"]},
36:{r:"Perímetro: sumá todos los lados (el borde). Área: lo de adentro, en unidades cuadradas. Rectángulo: base . altura. Triángulo: base . altura : 2.",x:["Rectángulo de 6 m por 2 m → P = 6 + 2 + 6 + 2 = 16 m","Área = 6 . 2 = 12 m²"]},
37:{r:"El área total es la suma de las áreas de todas las caras. Un cubo tiene 6 cuadrados iguales: 6 . lado².",x:["Cubo de 2 cm → 6 . 2² = 6 . 4 = 24 cm²"]},
38:{r:"1 l = 1 000 ml. 1 dm³ = 1 l, 1 cm³ = 1 ml y 1 m³ = 1 000 l. De litros a ml, multiplicá por 1 000.",x:["1,5 l = 1,5 . 1 000 = 1 500 ml","3 m³ = 3 . 1 000 = 3 000 l"]},
39:{r:"Volumen de una caja (prisma rectangular) = largo . ancho . alto. Cubo = lado³. Pirámide = área de la base . altura : 3.",x:["Caja de 5 cm × 2 cm × 3 cm → 5 . 2 . 3 = 30 cm³"]},
40:{r:"Volumen del cilindro = π . r² . h (usá π = 3,14). Primero elevá el radio al cuadrado y después multiplicá todo.",x:["r = 1 cm y h = 10 cm → 3,14 . 1² . 10 = 31,4 cm³"]},
41:{r:"Cualitativa: se responde con palabras (color, deporte). Cuantitativa discreta: se cuenta (hermanos, goles). Cuantitativa continua: se mide y puede tener decimales (altura, peso, tiempo).",x:["“¿Cuántas mascotas tenés?” → cuantitativa discreta","“¿Cuánto pesás?” → cuantitativa continua"]},
42:{r:"Frecuencia relativa = cuántas veces aparece : total de datos. Para pasarla a porcentaje, multiplicá por 100.",x:["5 de 25 eligieron fútbol → 5 : 25 = 0,2 → 0,2 . 100 = 20 %"]},
43:{r:"Promedio: sumá todos los datos y dividí por la cantidad. Mediana: ordenalos de menor a mayor y elegí el del medio. Moda: el que más se repite.",x:["Datos 3, 8, 5, 8, 6 → ordenados: 3, 5, 6, 8, 8","Promedio = 30 : 5 = 6 · Mediana = 6 · Moda = 8"]},
44:{r:"Probabilidad = casos favorables : casos posibles. Va de 0 (imposible) a 1 (seguro).",x:[`Bolsa con 2 bolitas rojas y 3 azules → P(roja) = ${F(2,5)}`,`Dado → P(sale 1 o 2) = ${F(2,6)} = ${F(1,3)}`]},
45:{r:"Si elegís una cosa de un grupo y otra de otro grupo, multiplicá las opciones. Para ordenar n cosas en fila: n . (n − 1) . … . 1.",x:["2 gustos de helado y 4 toppings → 2 . 4 = 8 combinaciones","3 libros en un estante → 3 . 2 . 1 = 6 formas"]},
46:{r:"En la recta numérica, es mayor el que está más a la derecha. Entre dos negativos, es mayor el que está más cerca del 0. El módulo |a| es la distancia al 0 (siempre es positivo).",x:["−3 > −9 porque −3 está más cerca del 0","|−12| = 12"]},
47:{r:"Igual signo: sumá y dejá el mismo signo. Distinto signo: restá y poné el signo del número más grande (sin mirar el signo). Restar un negativo es sumar: a − (−b) = a + b.",x:["(−9) + (+4) = −5","7 − (−2) = 7 + 2 = 9"]},
48:{r:"Regla de los signos: signos iguales dan +, signos distintos dan −. Potencia de base negativa: con exponente par da +, con exponente impar da −.",x:["(−5) . (−2) = +10","(+12) : (−4) = −3","(−3)² = 9 y (−3)³ = −27"]},
49:{r:"Separá en términos y resolvé cada uno con la regla de los signos. Al final, juntá los positivos por un lado y los negativos por el otro.",x:["−4 + 2 . (−3) − (−6) : 2 = −4 − 6 + 3 = −7"]}
};

/* ---------- Paso a paso de cada ejercicio (p: pasos, t: consejo) ---------- */
const EXPL={
"1-0":{p:["Ubicá cada cifra en su lugar, de derecha a izquierda: 5 → unidades, 1 → decenas, 3 → centenas, 7 → unidades de mil, 4 → decenas de mil.","El 7 está en las unidades de mil, y cada unidad de mil vale 1 000.","Entonces el 7 vale 7 . 1 000 = 7 000."],t:"Mirá el lugar de la cifra, no solo la cifra: el mismo 7 vale 7, 70, 700 o 7 000 según dónde esté."},
"1-1":{p:["Calculá cada potencia de 10: 10³ = 10 . 10 . 10 = 1 000 (un 1 y 3 ceros); 10² = 10 . 10 = 100; 10⁰ = 1 (todo número elevado a la 0 da 1).","Multiplicá cada una: 5 . 1 000 = 5 000; 2 . 100 = 200; 4 . 1 = 4.","Sumá: 5 000 + 200 + 4 = 5 204. Como no hay decenas, en ese lugar va un 0."],t:"El exponente del 10 dice cuántos ceros lleva: 10³ tiene 3 ceros (1 000). 10³ NO es 10 . 3 = 30."},
"2-0":{p:["Buscá cuántas veces entra el 5 en 47 sin pasarte: 5 . 9 = 45 (5 . 10 = 50 ya se pasa).","Lo que sobra es el resto: 47 − 45.","47 − 45 = 2. Comprobá: 5 . 9 + 2 = 47 ✔. El resto (2) es menor que el divisor (5), así que está bien."],t:"El resto siempre tiene que ser más chico que el divisor. Si te da más grande, el cociente puede ser mayor."},
"2-1":{p:["Distributiva: el 3 multiplica a cada número del paréntesis, respetando los signos: 7 . 3 + 5 . 3 − 2 . 3.","Hacé las multiplicaciones: 21 + 15 − 6.","21 + 15 = 36 y 36 − 6 = 30. (Comprobación: 7 + 5 − 2 = 10 y 10 . 3 = 30.)"],t:"No te olvides de multiplicar también el número que está restando."},
"3-0":{p:["2⁵ quiere decir multiplicar el 2 por sí mismo 5 veces: 2 . 2 . 2 . 2 . 2.","Andá de a pasos: 2 . 2 = 4; 4 . 2 = 8; 8 . 2 = 16; 16 . 2 = …","El último paso da 32."],t:"2⁵ NO es 2 . 5 = 10. El exponente dice cuántas veces se repite la base."},
"3-1":{p:["Cuando se multiplican potencias de la misma base, se deja la base y se suman los exponentes: 2<sup>x</sup> . 2⁶ = 2<sup>x + 6</sup>.","Como 2<sup>x + 6</sup> = 2¹⁰ y las bases son iguales, los exponentes también: x + 6 = 10.","Despejá: x = 10 − 6 = 4. Comprobá: 2⁴ . 2⁶ = 2¹⁰ ✔"],t:"En un producto de igual base, los exponentes se SUMAN, no se multiplican."},
"3-2":{p:["La raíz cúbica pregunta: ¿qué número, multiplicado 3 veces por sí mismo, da 125?","Probá: 3 . 3 . 3 = 27 (poco); 4 . 4 . 4 = 64 (poco); 5 . 5 . 5 = 125 ✔","Entonces la raíz cúbica de 125 es 5."],t:"Raíz cúbica: el número se repite 3 veces. Raíz cuadrada: 2 veces."},
"4-0":{p:["Separá en términos con los + y −: 35 | + 4 . 12 | − 2.","Resolvé primero la multiplicación: 4 . 12 = 48.","Sumá y restá de izquierda a derecha: 35 + 48 = 83; 83 − 2 = 81."],t:"Si hacés 35 + 4 primero, te da mal: la multiplicación va antes que la suma."},
"4-1":{p:["Empezá por las raíces de adentro del paréntesis: √14 400 = 120 (porque 120 . 120 = 14 400) y √100 = 10.","Dentro del paréntesis, primero la división y después la resta: 120 : 10 = 12; 12 − 6 = 6.","La raíz de afuera: la raíz cúbica de 2³ es 2 (la raíz cúbica y el cubo se cancelan).","Multiplicá: 6 . 2 = 12."],t:"14 400 es 144 con dos ceros: como √144 = 12, entonces √14 400 = 120."},
"4-2":{p:["Adentro de las raíces: 5⁰ = 1 (todo número elevado a la 0 da 1) y 1 + 6 . 4 = 1 + 24 = 25.","Las raíces: √1 = 1, √25 = 5 y √144 = 12.","El paréntesis al cuadrado: (1 + 5)² = 6² = 36.","Dentro del corchete: 36 : 12 = 3; 3 − 2 = 1.","Por último: 1²⁰ = 1, porque 1 multiplicado por sí mismo siempre da 1."],t:"5⁰ no es 0, es 1. Y resolvé siempre de adentro hacia afuera."},
"5-0":{p:["Criterio del 9: un número es divisible por 9 si la suma de sus cifras es múltiplo de 9.","Sumá las cifras de 156: 1 + 5 + 6 = 12.","12 no es múltiplo de 9 (los múltiplos son 9, 18, 27…), así que 156 NO es divisible por 9. Sí lo es por 3, porque 12 es múltiplo de 3."],t:"No confundas el criterio del 3 con el del 9: los dos suman las cifras, pero el del 9 pide un múltiplo de 9."},
"5-1":{p:["Un número primo solo se puede dividir por 1 y por sí mismo. Probá los números que siguen al 20, uno por uno.","21 = 3 . 7 → no es primo. 22 = 2 . 11 → no es primo.","23 no se puede dividir por 2, ni por 3, ni por 5 → es primo. La respuesta es 23."],t:"Para saber si un número es primo, probá dividirlo por 2, 3, 5 y 7. Si ninguna división da exacta, es primo."},
"6-0":{p:["Factorizá 60 dividiendo por primos: 60 : 2 = 30; 30 : 2 = 15; 15 : 3 = 5; 5 : 5 = 1.","Usaste el 2 dos veces, el 3 una vez y el 5 una vez: 60 = 2 . 2 . 3 . 5.","2 . 2 se escribe 2², así que 60 = 2² . 3 . 5 y a = 2."],t:"El exponente cuenta cuántas veces aparece ese primo en la factorización."},
"6-1":{p:["Factorizá 36: 36 : 2 = 18; 18 : 2 = 9; 9 : 3 = 3; 3 : 3 = 1.","Usaste el 2 dos veces y el 3 dos veces: 36 = 2 . 2 . 3 . 3.","Con potencias: 36 = 2² . 3². Comprobá: 4 . 9 = 36 ✔"],t:"Verificá siempre multiplicando: 2 . 3³ = 54 y 2³ . 3 = 24, ninguno da 36."},
"7-0":{p:["Factorizá los dos números: 12 = 2² . 3 y 18 = 2 . 3².","Para el mcm se toman TODOS los factores (comunes y no comunes) con el MAYOR exponente: del 2, el mayor es 2²; del 3, el mayor es 3².","mcm = 2² . 3² = 4 . 9 = 36. Comprobá: 36 es múltiplo de 12 y de 18 ✔"],t:"mcm → todos los factores, con el mayor exponente. dcm → solo los comunes, con el menor."},
"7-1":{p:["Factorizá los dos números: 12 = 2² . 3 y 18 = 2 . 3².","Para el dcm se toman solo los factores COMUNES con el MENOR exponente: del 2, el menor es 2¹; del 3, el menor es 3¹.","dcm = 2 . 3 = 6. Comprobá: 12 : 6 = 2 y 18 : 6 = 3, las dos divisiones son exactas ✔"],t:"El dcm nunca puede ser más grande que el número más chico."},
"7-2":{p:["Pensá qué pide el problema: un momento en que los dos colectivos coincidan otra vez. Eso es un múltiplo de 15 y de 20 → se busca el mcm.","Factorizá: 15 = 3 . 5 y 20 = 2² . 5. Tomá todos los factores con el mayor exponente: 2² . 3 . 5.","mcm = 4 . 3 . 5 = 60. Vuelven a coincidir a los 60 minutos (1 hora)."],t:"Si algo “vuelve a coincidir”, es mcm. Si hay que “repartir en partes iguales”, es dcm."},
"8-0":{p:["Queremos dejar la x sola. El 7 está restando: pasa al otro lado sumando → 3 . x = 17 + 7.","Hacé la cuenta: 3 . x = 24.","El 3 está multiplicando: pasa dividiendo → x = 24 : 3 = 8. Verificá: 3 . 8 − 7 = 24 − 7 = 17 ✔"],t:"Primero se pasa lo que suma o resta, y después lo que multiplica o divide."},
"8-1":{p:["Traducí a lenguaje simbólico: “el doble de un número” es 2 . x; “aumentado en 4” es + 4; “es 20” es = 20. Queda 2 . x + 4 = 20.","El 4 pasa restando: 2 . x = 20 − 4 = 16.","El 2 pasa dividiendo: x = 16 : 2 = 8. Verificá: 2 . 8 + 4 = 20 ✔"],t:"“El doble” es multiplicar por 2; “aumentado en” es sumar."},
"9-0":{p:[`${F(7,4)} quiere decir 7 cuartos. Para ver cuántos enteros hay, dividí 7 : 4.`,"7 : 4 = 1 y sobran 3 (porque 4 . 1 = 4 y 7 − 4 = 3).",`El cociente (1) son los enteros y el resto (3) va arriba de la fracción: 1 entero y ${F(3,4)}. El número que falta es 3.`],t:"El denominador no cambia: si eran cuartos, siguen siendo cuartos."},
"9-1":{p:["Fijate si el numerador es múltiplo del denominador: ¿el 8 se puede dividir exacto por 4?",`Sí: 8 : 4 = 2. Entonces ${F(8,4)} es igual a 2, un número entero.`,"Cuando una fracción es igual a un número entero, se llama aparente."],t:"Propia: el numerador es menor (vale menos de 1). Impropia: el numerador es mayor (vale más de 1). Aparente: da un número entero."},
"10-0":{p:["Buscá un número que divida al 12 y al 18 a la vez. El más grande es 6 (es su dcm).",`Dividí arriba y abajo por 6: 12 : 6 = 2 y 18 : 6 = 3 → ${F(2,3)}.`,`2 y 3 no tienen divisores en común, así que ${F(2,3)} es irreducible.`],t:`Si no ves el 6, podés ir de a poco: primero por 2 (${F(6,9)}) y después por 3 (${F(2,3)}).`},
"10-1":{p:["Para comparar, pasá las dos fracciones al mismo denominador. El mcm de 3 y 4 es 12.",`${F(2,3)} = ${F(8,12)} (multiplicaste arriba y abajo por 4) y ${F(3,4)} = ${F(9,12)} (por 3).`,`Con igual denominador, es mayor la de mayor numerador: 9 es mayor que 8, entonces ${F(3,4)} es mayor.`],t:"No alcanza con mirar el numerador o el denominador por separado: primero hay que igualar los denominadores."},
"11-0":{p:["Los denominadores son distintos (2 y 3): buscá un denominador común. El mcm de 2 y 3 es 6.",`Convertí: ${F(1,2)} = ${F(3,6)} y ${F(1,3)} = ${F(2,6)}.`,`Sumá los numeradores y dejá el denominador: ${F(3,6)} + ${F(2,6)} = ${F(5,6)}.`],t:`Nunca sumes los denominadores: ${F(1,2)} + ${F(1,3)} NO es ${F(2,5)}.`},
"11-1":{p:["En la multiplicación de fracciones se multiplica numerador por numerador y denominador por denominador.","Numeradores: 2 . 4 = 8. Denominadores: 3 . 5 = 15.",`Resultado: ${F(8,15)}. No se puede simplificar porque 8 y 15 no tienen divisores en común.`],t:"Para multiplicar fracciones NO hace falta un denominador común."},
"11-2":{p:[`Para dividir fracciones, se multiplica la primera por la segunda dada vuelta (su inversa): ${F(1,2)} dada vuelta es ${F(2,1)}.`,`${F(3,4)} . ${F(2,1)} = ${F("3 . 2","4 . 1")} = ${F(6,4)}.`,`Simplificá por 2: ${F(6,4)} = ${F(3,2)}.`],t:"Se da vuelta solo la segunda fracción, la que divide."},
"12-0":{p:[`Elevar al cuadrado es multiplicar la fracción por sí misma: ${F(2,3)} . ${F(2,3)}.`,"Se eleva el numerador y el denominador por separado: 2² = 4 y 3² = 9.",`Resultado: ${F(4,9)}.`],t:`(${F(2,3)})² no es ${F(4,6)}: el denominador también se eleva al cuadrado.`},
"12-1":{p:["La raíz de una fracción es la raíz del numerador sobre la raíz del denominador.","√9 = 3 (porque 3 . 3 = 9) y √16 = 4 (porque 4 . 4 = 16).",`Resultado: ${F(3,4)}. Comprobá: ${F(3,4)} . ${F(3,4)} = ${F(9,16)} ✔`],t:"La raíz se aplica a los dos números, arriba y abajo."},
"13-0":{p:[`Separá en términos: ${F(1,2)} | + ${F(3,4)} . ${F(2,3)}. Primero va la multiplicación.`,`${F(3,4)} . ${F(2,3)} = ${F(6,12)}, y simplificando: ${F(6,12)} = ${F(1,2)}.`,`Ahora sumá: ${F(1,2)} + ${F(1,2)} = ${F(2,2)} = 1.`],t:"Igual que con los números naturales: primero se multiplica y después se suma."},
"14-0":{p:[`Una fracción es una división: ${F(3,4)} = 3 : 4.`,"Como 3 es menor que 4, ponés 0 y coma, y seguís: 30 : 4 = 7 (sobran 2); después 20 : 4 = 5.",`Resultado: 0,75. (También sirve: ${F(3,4)} = ${F(75,100)} = 0,75.)`],t:`Pensalo con plata: ${F(3,4)} de $1 son 75 centavos → 0,75.`},
"14-1":{p:[`0,25 tiene 2 cifras después de la coma: se escribe ${F(25,100)}.`,"Simplificá: 25 y 100 se pueden dividir por 25 → 25 : 25 = 1 y 100 : 25 = 4.",`Resultado: ${F(1,4)}.`],t:"1 cifra decimal → sobre 10; 2 cifras → sobre 100; 3 cifras → sobre 1 000."},
"15-0":{p:["Separá en términos: 2,5 | + 1,2 . 3. Primero va la multiplicación.","1,2 . 3: hacé 12 . 3 = 36 y poné 1 decimal (porque 1,2 tiene una cifra después de la coma) → 3,6.","Sumá alineando la coma: 2,5 + 3,6 = 6,1."],t:"Si sumás primero (2,5 + 1,2 = 3,7) y después multiplicás, te da mal."},
"15-1":{p:["Para dividir por un número con coma, multiplicá los dos por 10 hasta que el divisor no tenga coma: 4,5 . 10 = 45 y 0,5 . 10 = 5.","La división queda 45 : 5.","45 : 5 = 9. (Tiene sentido: en 4,5 entran 9 medios.)"],t:"Dividir por 0,5 es lo mismo que multiplicar por 2: el resultado da MÁS grande."},
"16-0":{p:[`El 20 % es ${F(20,100)}, o sea 0,2 (también es la quinta parte).`,"Multiplicá: 0,2 . 150. (O también: 150 : 100 = 1,5 y 1,5 . 20.)","El resultado es 30."],t:"Truco: el 10 % se saca corriendo la coma un lugar (15), y el 20 % es el doble (30)."},
"16-1":{p:["Los centésimos son la segunda cifra después de la coma: en 3,476 es el 7.","Mirá la cifra que sigue, el 6. Como 6 es 5 o más, el 7 sube a 8.","Resultado: 3,48."],t:"Si la cifra siguiente es 0, 1, 2, 3 o 4, queda igual. Si es 5 o más, se sube uno."},
"17-0":{p:["Un punto se escribe (x; y): primero va el movimiento horizontal y después el vertical.","Avanzar 4 hacia la derecha es x = 4. Subir 1 es y = 1.","El punto es (4; 1)."],t:"(4; 1) y (1; 4) son puntos distintos: el orden importa."},
"18-0":{p:["La fórmula es y = x + 2, y te dicen que x = 5 km.","Reemplazá la x por 5: y = 5 + 2.","y = 7 → cobra $7 (miles)."],t:"Reemplazar es poner el número en el lugar de la letra."},

const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function parse(raw){
  let s=String(raw).trim().toLowerCase().replace(/[−–—]/g,"-").replace(/\s+/g,"");
  s=s.replace(/^x=/,"").replace(/^\$/,"").replace(/(cm³|cm²|cm|m³|m²|ml|kg|km|l|°|%|')$/,"");
  let m=s.match(/^(-?\d+)\/(-?\d+)$/);
  if(m){const n=+m[1],d=+m[2];if(!d)return null;return{v:n/d,irr:gcd(n,d)===1};}
  s=s.replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");
  if(/^-?\d+(\.\d+)?$/.test(s))return{v:parseFloat(s),irr:true};
  return null;
}
function target(e){if(typeof e.a==="number")return e.a;const[n,d]=e.a.split("/");return d?n/d:+n;}
function check(e,input){
  if(e.opt)return input===e.a;
  const p=parse(input);if(!p)return "fmt";
  if(Math.abs(p.v-target(e))>1e-9)return false;
  if(e.irr&&!p.irr)return "irr";
  return true;
}

  if(code==="rate_limited")return"Hubo muchas correcciones seguidas. Esperá un minuto y volvé a enviar.";
  if(code==="image_rejected")return"No se pudo abrir la foto. Probá con otra (JPG o PNG, menos de 20 MB).";
  if(code==="session_expired")return"Tu sesión de Claude venció. Volvé a iniciar sesión y enviá de nuevo.";
  if(code==="refused")return"No se pudo revisar esa foto. Sacá una foto solo de la hoja con el ejercicio.";
  return"No se pudo corregir en este momento. Probá enviar de nuevo.";
}

let AC=null;
function ac(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==="suspended")AC.resume();return AC;}catch(e){return null;}}
function noise(a,t,dur,o={}){const{type="bandpass",f=1000,f2=null,q=1,g=.3,attack=.01}=o;
  const b=a.createBuffer(1,Math.ceil(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);fl.Q.value=q;
  const gn=a.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+attack);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl).connect(gn).connect(a.destination);s.start(t);s.stop(t+dur);}
function tone(a,t,dur,o={}){const{type="sine",f=440,f2=null,g=.2,attack=.01,vib=0,rate=0}=o;
  const os=a.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);if(f2)os.frequency.exponentialRampToValueAtTime(f2,t+dur);
  if(vib){const l=a.createOscillator(),lg=a.createGain();l.frequency.value=rate;lg.gain.value=vib;l.connect(lg).connect(os.frequency);l.start(t);l.stop(t+dur);}
  const gn=a.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(g,t+attack);gn.gain.setValueAtTime(g,t+Math.max(attack+.01,dur-.08));gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  os.connect(gn).connect(a.destination);os.start(t);os.stop(t+dur+.02);}
function sfx(kind){
  if(S.mute)return;const a=ac();if(!a)return;const t=a.currentTime+.02;
  try{
  if(kind==="photo"){ // obturador de cámara
    noise(a,t,.05,{type:"highpass",f:3000,g:.35});tone(a,t,.03,{type:"square",f:1800,g:.05});noise(a,t+.09,.07,{type:"highpass",f:2500,g:.25});}
  else if(kind==="whistle"){ // silbato del árbitro
    tone(a,t,.18,{f:2900,g:.12,vib:110,rate:32});tone(a,t+.26,.5,{f:2900,g:.14,vib:120,rate:34});}
  else if(kind==="goal"){ // tribuna gritando gol + bombo + corneta
    noise(a,t,2.8,{f:900,q:.6,g:.45,attack:.35});noise(a,t+.1,2.6,{f:2100,q:.8,g:.22,attack:.45});
    [0,.33,.66,1.0,1.33,1.66].forEach(d=>tone(a,t+d,.24,{f:130,f2:48,g:.55,attack:.005}));
    tone(a,t+.15,.16,{type:"sawtooth",f:523,g:.06});tone(a,t+.35,.16,{type:"sawtooth",f:523,g:.06});tone(a,t+.55,.7,{type:"sawtooth",f:659,g:.07,vib:6,rate:6});}
  else if(kind==="miss"){ // "uhhh" de la tribuna + trombón triste
    noise(a,t,1.7,{f:650,f2:230,q:1.3,g:.4,attack:.15});
    tone(a,t+.2,.3,{type:"triangle",f:392,g:.18});tone(a,t+.52,.3,{type:"triangle",f:370,g:.18});tone(a,t+.84,.3,{type:"triangle",f:349,g:.18});tone(a,t+1.16,.95,{type:"triangle",f:330,g:.2,vib:7,rate:6});}
  }catch(e){}
}

 <ellipse cx="0" cy="2" rx="22" ry="4" fill="#000" opacity=".18"/>
 <path d="M-9 -44L-13 -8M9 -44L14 -8" stroke="${SKIN}" stroke-width="9" stroke-linecap="round"/>
 <path d="M-12 -24L-13 -7M13 -24L14 -7" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
 <path d="M-12 -24L-12.4 -19M13 -24L13.4 -19" stroke="${CEL}" stroke-width="10"/>
 <ellipse cx="-15" cy="-3" rx="9" ry="4.5" fill="#1a1a1a"/><ellipse cx="17" cy="-3" rx="9" ry="4.5" fill="#1a1a1a"/>
 <path d="M-17 -60H17L19 -40H3L0 -46L-3 -40H-19Z" fill="${SHORTS}"/>
 <path d="M-15 -94L-30 -118L-33 -136M15 -94L30 -118L33 -136" stroke="${SKIN}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
 <path d="M-15 -95L-23 -108M15 -95L23 -108" stroke="${CEL}" stroke-width="12"/>
 <path d="M-19 -99Q0 -102 19 -99L18 -58H-18Z" fill="url(#${kit})" stroke="#3B87B5" stroke-width="1.2"/>
 <text x="0" y="-88" text-anchor="middle" font-family="Rubik,Arial,sans-serif" font-weight="900" font-size="${fs}" fill="#1E2235" stroke="#fff" stroke-width="2.2" paint-order="stroke" letter-spacing=".3">${name}</text>
 <text x="0" y="-63" text-anchor="middle" font-family="Rubik,Arial,sans-serif" font-weight="900" font-size="21" fill="#1E2235" stroke="#fff" stroke-width="2.6" paint-order="stroke">${num}</text>
 <rect x="-4" y="-107" width="8" height="9" fill="${SKIN}"/>
 <circle cx="-12" cy="-116" r="3" fill="${SKIN}"/><circle cx="12" cy="-116" r="3" fill="${SKIN}"/>
 <circle cx="0" cy="-117" r="12" fill="#2B1D14"/></g>`;}
const GOAL_SVG=(name,num)=>`<svg viewBox="0 0 320 190" aria-hidden="true"><defs>${KIT("kitA")}</defs>${field}${goalNet(232,74,78,72)}${ball(286,136)}
 <g transform="translate(72,170)"><g class="jump d2">${playerUp("q","kitA",true)}</g></g>
 <g transform="translate(158,182) scale(1.2)"><g class="jump">${playerBack("kitA",name,num)}</g></g></svg>`;
const MISS_SVG=()=>`<svg viewBox="0 0 320 190" aria-hidden="true"><defs>${KIT("kitB")}</defs>${field}${goalNet(40,62,130,84)}${ball(120,136)}
 <g transform="translate(240,176)"><g class="sob">${playerSad("kitB")}</g></g></svg>`;
let sceneT;
function celebrate(ok,p,msg){
  const sc=$("#scene");clearTimeout(sceneT);
  sc.className="scene "+(ok?"ok":"no");
  const nm=(S.name||"").trim().split(/\s+/)[0]||"";const shirt=nm?esc(nm.toUpperCase().slice(0,9)):"CRACK";const shirtNum=/^\d{1,2}$/.test(S.num||"")&&+S.num>0?String(+S.num):"10";
  sc.innerHTML=`<div class="scard">${ok?GOAL_SVG(shirt,shirtNum):MISS_SVG()}<div class="stitle">${ok?"¡GOOOL!":"¡Uy! Nos hicieron un gol"}</div><div class="ssub">${ok?(nm?`¡Gol de ${esc(nm)}! +${p} puntos`:`¡Ejercicio correcto! +${p} puntos<br><small>Escribí tu nombre arriba para verlo en la camiseta</small>`):(msg||"Revisá la devolución, corregí la hoja y volvé a intentar")}</div></div>`;
  if(ok){const cols=[CEL,"#FFFFFF",CEL,"#F5B400"];for(let i=0;i<46;i++){const c=document.createElement("span");c.className="conf";c.style.left=Math.random()*100+"%";c.style.background=cols[i%cols.length];c.style.animationDuration=(1.8+Math.random()*1.6)+"s";c.style.animationDelay=(Math.random()*.6)+"s";sc.appendChild(c);}}
  sc.hidden=false;
  const close=()=>{sc.hidden=true;sc.innerHTML="";};
  sc.onclick=close;sceneT=setTimeout(close,ok?3200:2800);
}
/* ---------- Registro de intentos para el profe ---------- */
let DB=null,USR=null,UID=null,PROFE=false,LOGQ=Promise.resolve();
(async()=>{
  try{DB=await window.claude?.use?.("db")||null;}catch(e){DB=null;}
  try{USR=await window.claude?.use?.("user")||null;}catch(e){USR=null;}
  try{UID=USR?await USR.id():null;}catch(e){UID=null;}
  try{PROFE=USR?((await USR.isOwner())||(await USR.canEdit())):false;}catch(e){PROFE=false;}
  regStatus();if(PROFE)tabs();if(S.cap==="profe")view();
})();
function regStatus(){const r=$("#reg");if(!r)return;r.hidden=false;
  if(REGISTRO_URL){const has=!!(S.name||"").trim();r.className="reg "+(has?"on":"off");
    r.textContent=has?"● Tus ejercicios quedan registrados para el profe":"○ Escribí tu nombre para que el profe vea tus ejercicios";return;}
  const on=!!(DB&&UID);r.className="reg "+(on?"on":"off");
  r.textContent=on?"● Tus ejercicios quedan registrados para el profe":"○ Sin registro: tus ejercicios no le llegan al profe";}
/* Envío a Google Sheets: text/plain + no-cors para que no haga falta preflight.
   Si no hay internet, el intento queda pendiente y se reenvía en el próximo envío o al volver a abrir la página. */
let SENDING=false;
async function flushPend(){
  if(!REGISTRO_URL||SENDING)return;S.pend=S.pend||[];if(!S.pend.length)return;SENDING=true;
  try{while(S.pend.length){const row=S.pend[0];
      await fetch(REGISTRO_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({},row,{foto:PENDPH[row.id]||""}))});
      delete PENDPH[row.id];S.pend.shift();save();}}
  catch(err){/* sin conexión: se reintenta más tarde */}
  finally{SENDING=false;}
}
const PENDPH={}; // fotos pendientes de envío (en memoria, no en el navegador)
async function prepFoto(file){
  if(!file)return"";
  try{const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});const k=Math.min(1,1100/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.6);}
  catch(e){if(file.size>2e6)return"";return await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=()=>ok("");r.readAsDataURL(file);});}
}
async function logAttempt(e,t,val,res,pts,foto){
  const intento=res==="correcto"?(S.tries[e.id]||0)+1:(S.tries[e.id]||0);
  const now=new Date().toISOString();
  if(!S.dev){S.dev=Math.random().toString(36).slice(2,8);save();}
  const row={fecha:now,alumno:(S.name||"").trim()||"Sin nombre",numero:S.num||"",dispositivo:S.dev,capitulo:e.cap,tema:`${t.n}. ${t.t}`,
    ejercicio:`${t.n}${"abcdefgh"[t.ej.indexOf(e)]}`,enunciado:plain(e.q),respuesta:String(val),correcta:ansText(e),
    resultado:res,intento,maxIntentos:MAXT,puntos:pts,totalPuntos:total()};
  if(REGISTRO_URL){row.id=Math.random().toString(36).slice(2,10);const ph=await prepFoto(foto);if(ph)PENDPH[row.id]=ph;
    S.pend=S.pend||[];if(S.pend.length<500)S.pend.push(row);save();flushPend();}
  if(!DB||!UID)return;
  const base=`intentos/${UID}`;
  LOGQ=LOGQ.then(async()=>{
    try{await DB.collection(base+"/registros").add(row);
      await DB.doc(base).set({alumno:row.alumno,numero:row.numero,ultimaActividad:now,totalPuntos:total(),resueltos:Object.keys(S.solved).length,sinIntentos:Object.keys(S.failed||{}).length});}
    catch(err){if(err&&err.code==="quota_exceeded")toast("El registro del profe está lleno: avisale al profe");}
  });
}
const fmtFecha=s=>{try{return new Date(s).toLocaleString("es-AR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}catch(e){return s;}};
async function panel(v){
  v.innerHTML=`<div class="chead"><div><small>SOLO PARA EL PROFE</small><h2>Panel del profe</h2></div></div><div id="pbody">Cargando el registro…</div>`;
  const pb=$("#pbody");
  if(!DB){pb.textContent="El registro todavía no está disponible en esta vista. Si recién abriste la página, esperá unos segundos y volvé a entrar a esta pestaña.";return;}
  try{
    const snap=await DB.collection("intentos").orderBy("ultimaActividad","desc").get();
    if(!document.body.contains(pb))return;
    if(snap.empty){pb.innerHTML=`<p>Todavía no hay ejercicios registrados. Cuando un alumno envíe un ejercicio, va a aparecer acá.</p>`;return;}
    let html="";
    for(const d of snap.docs){const s=d.data()||{};
      const rs=await DB.collection(`intentos/${d.id}/registros`).orderBy("fecha","desc").limit(50).get();
      html+=`<section class="tema"><div class="th"><span class="n">${esc(s.numero||"–")}</span><h3>${esc(s.alumno||"Sin nombre")}</h3><span class="tp">${s.totalPuntos||0} pts · ${s.resueltos||0} bien · ${s.sinIntentos||0} sin intentos</span></div>
      <div class="ptab"><table><thead><tr><th>Fecha</th><th>Ejercicio</th><th>Respondió</th><th>Correcta</th><th>Resultado</th><th>Intento</th><th>Pts</th></tr></thead><tbody>
      ${rs.docs.map(x=>{const r=x.data()||{};return`<tr><td>${esc(fmtFecha(r.fecha))}</td><td class="l">${esc(r.ejercicio)} · ${esc(r.tema)}</td><td>${esc(r.respuesta)}</td><td>${esc(r.correcta)}</td><td><span class="stt ${r.resultado==="correcto"?"y":"n"}">${esc(r.resultado)}</span></td><td>${esc(r.intento)} de ${esc(r.maxIntentos||MAXT)}</td><td>${esc(r.puntos)}</td></tr>`;}).join("")}
      </tbody></table></div></section>`;}
    if(!document.body.contains(pb))return;
    pb.innerHTML=`<div class="temas">${html}</div>`;
  }catch(err){if(document.body.contains(pb))pb.textContent="No se pudo leer el registro. Probá de nuevo en un rato.";}
}

function render(){header();tabs();view();}
/* ---------- Bienvenida: nombre y número de camiseta ---------- */
function updatePlayer(){const el=$("#player");if(!el)return;const nm=(S.name||"").trim();
  el.innerHTML=nm?`Jugador: <b>${esc(nm)}</b> · N.° <b>${esc(S.num||"10")}</b>`:"";regStatus();}
function welcome(){
  const w=$("#welcome");
  w.innerHTML=`<form class="wcard" id="wform" role="dialog" aria-modal="true" aria-labelledby="wt" novalidate>
    <div class="wsvg" id="wsvg" aria-hidden="true"></div>
    <h2 id="wt">¡Bienvenido/a a la cancha!</h2>
    <p>Antes de jugar, contanos quién sos. Tu nombre y tu número van a aparecer en la camiseta cada vez que hagas un gol.</p>
    <div class="wrow"><div class="wf"><label for="w-nombre">Tu nombre</label><input id="w-nombre" maxlength="30" autocomplete="off" placeholder="Ej: Mateo Pérez"></div>
      <div class="wf wn"><label for="w-num">N.° camiseta</label><input id="w-num" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="10"></div></div>
    <div class="werr" id="werr" role="alert"></div>
    <button class="btn go wgo" type="submit">¡A jugar!</button></form>`;
  const n=$("#w-nombre"),u=$("#w-num"),er=$("#werr");
  n.value=S.name||"";u.value=S.num||"";
  const prev=()=>{const nm=n.value.trim().split(/\s+/)[0]||"";const num=/^\d{1,2}$/.test(u.value)&&+u.value>0?String(+u.value):"10";
    $("#wsvg").innerHTML=`<svg viewBox="0 0 320 190"><defs>${KIT("kitW")}</defs>${field}<g transform="translate(160,182) scale(1.2)">${playerBack("kitW",nm?esc(nm.toUpperCase().slice(0,9)):"TU NOMBRE",num)}</g></svg>`;};
  n.addEventListener("input",()=>{er.textContent="";prev();});
  u.addEventListener("input",()=>{u.value=u.value.replace(/\D/g,"").slice(0,2);er.textContent="";prev();});
  $("#wform").addEventListener("submit",ev=>{ev.preventDefault();
    const nm=n.value.trim().replace(/\s+/g," "),num=u.value;
    if(!nm){er.textContent="Escribí tu nombre para entrar.";n.focus();return;}
    if(!/^\d{1,2}$/.test(num)||+num<1){er.textContent="Elegí un número de camiseta del 1 al 99.";u.focus();return;}
    S.name=nm;S.num=String(+num);save();w.hidden=true;w.innerHTML="";document.body.style.overflow="";
    updatePlayer();flushPend();sfx("whistle");toast(`¡A la cancha, ${nm.split(" ")[0]}!`);});
  prev();w.hidden=false;document.body.style.overflow="hidden";setTimeout(()=>n.focus(),50);
}
$("#cambiar").onclick=()=>welcome();
updatePlayer();welcome();
render();
</script>
